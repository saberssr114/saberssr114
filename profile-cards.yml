name: Generate Profile Cards

on:
  workflow_dispatch:            # manual "Run workflow" button
  schedule:
    - cron: "0 */12 * * *"      # every 12 hours
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check files are in the right place
        run: |
          test -f scripts/generate_cards.py || { echo "::error::scripts/generate_cards.py is missing. Create it inside a folder named scripts."; exit 1; }
          mkdir -p assets

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=00dcff&color_dots=0f1722,0a4a5e,0a7f9c,00b8e0,00dcff&color_dot_border=1b2733

      - name: Stats, languages and calendar cards
        run: python3 scripts/generate_cards.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: assets

      - name: Save images to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update profile cards"
          git pull --rebase origin ${{ github.ref_name }}
          git push
